<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel — Companion Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e; --muted: #2a2a3d;
    --text: #e2e2f0; --text-dim: #6b6b8a; --accent: #7c6af7; --accent-lo: #7c6af720;
    --happy: #4ade80; --sad: #60a5fa; --thinking: #f59e0b;
    --curious: #a78bfa; --neutral: #94a3b8; --excited: #f472b6;
    --font-display: 'Space Mono', monospace; --font-body: 'Space Grotesk', sans-serif;
    --char-color: #7c6af7;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

  .app { display: grid; grid-template-columns: 280px 1fr 260px; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }

  header { grid-column: 1 / -1; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); gap: 16px; }
  .logo { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: var(--char-color); text-transform: uppercase; transition: color 0.5s; }
  .header-status { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; color: var(--text-dim); font-family: var(--font-display); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .panel-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-section { padding: 20px; border-bottom: 1px solid var(--border); }
  .panel-label { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 14px; }

  /* Emotion orb */
  .emotion-orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 20px; border-bottom: 1px solid var(--border); }
  .emotion-orb { width: 100px; height: 100px; border-radius: 50%; position: relative; transition: background 0.8s ease, box-shadow 0.8s ease; }
  .emotion-orb::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.15), transparent 60%); animation: orb-breathe 3s ease-in-out infinite; }
  @keyframes orb-breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.8; } }
  .emotion-label { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .emotion-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--text); text-align: center; }

  /* Mood bars */
  .mood-bars { display: flex; flex-direction: column; gap: 10px; }
  .mood-row { display: flex; align-items: center; gap: 10px; }
  .mood-row-name { width: 60px; color: var(--text-dim); font-family: var(--font-display); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .mood-bar-track { flex: 1; height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
  .mood-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
  .mood-count { width: 24px; text-align: right; color: var(--text-dim); font-size: 11px; font-family: var(--font-display); }

  /* Profile */
  .profile-text { font-size: 12px; color: var(--text-dim); line-height: 1.7; max-height: 160px; overflow-y: auto; }
  .profile-text ul { padding-left: 16px; }
  .profile-text li { margin-bottom: 4px; }
  .profile-empty { font-size: 12px; color: var(--text-dim); font-style: italic; }

  /* Chat */
  .chat-area { display: flex; flex-direction: column; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; max-width: 72%; animation: msg-in 0.25s ease; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.pixel { align-self: flex-start; align-items: flex-start; }

  .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
  .msg.user .msg-bubble { background: var(--char-color); color: #fff; border-bottom-right-radius: 4px; transition: background 0.5s; }
  .msg.pixel .msg-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }

  .msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--text-dim); font-family: var(--font-display); }
  .msg-emotion-tag { padding: 2px 8px; border-radius: 99px; font-size: 10px; font-family: var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
  .msg-audio-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 14px; padding: 0; transition: color 0.2s; }
  .msg-audio-btn:hover { color: var(--char-color); }

  .input-bar { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  .input-wrap { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 14px; transition: border-color 0.2s; }
  .input-wrap:focus-within { border-color: var(--char-color); }
  #msg-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 14px; padding: 12px 0; resize: none; height: 44px; max-height: 120px; }
  #msg-input::placeholder { color: var(--text-dim); }

  .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; transition: opacity 0.2s, transform 0.1s; }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-send { background: var(--char-color); color: #fff; height: 44px; transition: background 0.5s; }

  /* Right panel */
  .panel-right { border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

  /* Character switcher */
  .character-grid { display: flex; flex-direction: column; gap: 8px; }
  .char-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .char-card:hover { border-color: var(--muted); }
  .char-card.active { border-color: var(--char-active-color, #7c6af7); background: color-mix(in srgb, var(--char-active-color, #7c6af7) 10%, var(--surface)); }
  .char-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .char-info { flex: 1; min-width: 0; }
  .char-name { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .char-desc { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-active-badge { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border-radius: 99px; background: var(--char-active-color, #7c6af7); color: #fff; }

  /* History */
  .history-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .history-item { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .history-role { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .history-role.user { color: var(--char-color); transition: color 0.5s; }
  .history-role.assistant { color: var(--text-dim); }
  .history-content { color: var(--text-dim); font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Tabs */
  .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
  .tab.active { color: var(--text); border-bottom-color: var(--char-color); }
  .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* Empty / loading */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text-dim); text-align: center; padding: 32px; }
  .empty-state-icon { font-size: 32px; opacity: 0.4; }
  .empty-state-text { font-size: 13px; line-height: 1.6; }

  /* Typing indicator */
  .typing-indicator { display: flex; gap: 5px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: typing 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

  * { scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <span class="logo" id="header-logo">PIXEL</span>
    <span style="color:var(--text-dim);font-size:12px;font-family:var(--font-display)" id="header-subtitle">companion dashboard</span>
    <div class="header-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">connecting...</span>
    </div>
  </header>

  <!-- Left panel -->
  <aside class="panel-left">
    <div class="emotion-orb-wrap">
      <div class="panel-label" style="align-self:flex-start">current mood</div>
      <div class="emotion-orb" id="emotion-orb"></div>
      <div>
        <div class="emotion-label" id="char-label">pixel is feeling</div>
        <div class="emotion-name" id="emotion-name">—</div>
      </div>
    </div>

    <div class="panel-section" style="flex:1;overflow-y:auto">
      <div class="panel-label">mood history</div>
      <div class="mood-bars" id="mood-bars"><div style="color:var(--text-dim);font-size:12px">Loading...</div></div>
    </div>

    <div class="panel-section" style="flex:1;overflow-y:auto">
      <div class="panel-label">what pixel knows about you</div>
      <div id="profile-content" class="profile-empty">Chat more to build your profile.</div>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">◎</div>
        <div class="empty-state-text">Say something to Pixel.<br>It remembers everything.</div>
      </div>
    </div>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="msg-input" placeholder="Talk to Pixel..." rows="1"></textarea>
      </div>
      <button class="btn btn-send" id="send-btn" onclick="sendMessage()">SEND</button>
    </div>
  </main>

  <!-- Right panel -->
  <aside class="panel-right">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('history')">Log</div>
      <div class="tab" onclick="switchTab('characters')">Characters</div>
    </div>

    <!-- History tab -->
    <div class="tab-content active" id="tab-history">
      <div class="history-list" id="history-list">
        <div style="color:var(--text-dim);font-size:12px;padding:8px">Loading history...</div>
      </div>
    </div>

    <!-- Characters tab -->
    <div class="tab-content" id="tab-characters">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <div class="panel-label" style="margin-bottom:16px">choose a companion</div>
        <div class="character-grid" id="character-grid">
          <div style="color:var(--text-dim);font-size:12px">Loading characters...</div>
        </div>
      </div>
    </div>
  </aside>
</div>

<script>
  const API = '';

  const EMOTION_COLORS = {
    happy:    { hi: '#86efac', lo: '#14532d', glow: '#4ade8060', glow2: '#4ade8020' },
    sad:      { hi: '#93c5fd', lo: '#1e3a5f', glow: '#60a5fa60', glow2: '#60a5fa20' },
    thinking: { hi: '#fcd34d', lo: '#78350f', glow: '#f59e0b60', glow2: '#f59e0b20' },
    curious:  { hi: '#c4b5fd', lo: '#3b0764', glow: '#a78bfa60', glow2: '#a78bfa20' },
    neutral:  { hi: '#cbd5e1', lo: '#1e293b', glow: '#94a3b860', glow2: '#94a3b820' },
    excited:  { hi: '#f9a8d4', lo: '#500724', glow: '#f472b660', glow2: '#f472b620' },
  };

  const EMOTION_BAR_COLOR = {
    happy: '#4ade80', sad: '#60a5fa', thinking: '#f59e0b',
    curious: '#a78bfa', neutral: '#94a3b8', excited: '#f472b6',
  };

  let isFirstMessage = true;
  let activeCharColor = '#7c6af7';
  let activeCharName = 'Pixel';

  // ── Apply character theme ──
  function applyCharacter(charId, charData) {
    activeCharColor = charData.color;
    activeCharName = charData.name;
    document.documentElement.style.setProperty('--char-color', charData.color);
    document.getElementById('header-logo').style.color = charData.color;
    document.getElementById('char-label').textContent = `${charData.name.toLowerCase()} is feeling`;
    document.getElementById('header-subtitle').textContent = `${charData.name.toLowerCase()} · companion`;
    document.querySelectorAll('.msg.user .msg-bubble').forEach(el => el.style.background = charData.color);
    document.querySelector('.btn-send').style.background = charData.color;
    document.querySelectorAll('.history-role.user').forEach(el => el.style.color = charData.color);
  }

  // ── Emotion orb ──
  function setEmotion(emotion) {
    if (!EMOTION_COLORS[emotion]) emotion = 'neutral';
    const c = EMOTION_COLORS[emotion];
    const orb = document.getElementById('emotion-orb');
    orb.style.background = `radial-gradient(circle at 35% 35%, ${c.hi}, ${c.lo})`;
    orb.style.boxShadow = `0 0 40px ${c.glow}, 0 0 80px ${c.glow2}`;
    document.getElementById('emotion-name').textContent = emotion;
  }

  // ── Mood bars ──
  function renderMoodBars(stats) {
    const el = document.getElementById('mood-bars');
    if (!stats || !stats.length) { el.innerHTML = '<div style="color:var(--text-dim);font-size:12px">No data yet.</div>'; return; }
    const max = Math.max(...stats.map(s => s.count), 1);
    el.innerHTML = stats.map(s => `
      <div class="mood-row">
        <span class="mood-row-name">${s.emotion}</span>
        <div class="mood-bar-track"><div class="mood-bar-fill" style="width:${(s.count/max)*100}%;background:${EMOTION_BAR_COLOR[s.emotion]||'#7c6af7'}"></div></div>
        <span class="mood-count">${s.count}</span>
      </div>`).join('');
  }

  // ── Messages ──
  function addMessage(role, content, emotion, audioUrl) {
    if (isFirstMessage) { document.getElementById('messages').innerHTML = ''; isFirstMessage = false; }
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'user' : 'pixel'}`;
    let meta = `<span>${time}</span>`;
    if (emotion && role === 'assistant') {
      const color = EMOTION_BAR_COLOR[emotion] || '#7c6af7';
      meta += `<span class="msg-emotion-tag" style="background:${color}20;color:${color}">${emotion}</span>`;
    }
    if (audioUrl) meta += `<button class="msg-audio-btn" onclick="playAudio('${audioUrl}')">▶</button>`;
    const bubbleStyle = role === 'user' ? `style="background:${activeCharColor}"` : '';
    div.innerHTML = `<div class="msg-bubble" ${bubbleStyle}>${escapeHtml(content)}</div><div class="msg-meta">${meta}</div>`;
    const msgs = document.getElementById('messages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    if (isFirstMessage) { document.getElementById('messages').innerHTML = ''; isFirstMessage = false; }
    const div = document.createElement('div');
    div.className = 'msg pixel'; div.id = 'typing-indicator';
    div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    const msgs = document.getElementById('messages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() { const el = document.getElementById('typing-indicator'); if (el) el.remove(); }

  // ── Send message ──
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('send-btn');
    btn.disabled = true; input.value = ''; input.style.height = '44px';
    addMessage('user', text, null, null);
    showTyping();
    try {
      const res = await fetch(`${API}/chat/text`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      hideTyping();
      if (!res.ok) { const err = await res.json(); addMessage('assistant', `Error: ${err.error || 'Something went wrong.'}`, 'sad', null); return; }
      const data = await res.json();
      const audioUrl = data.audio_url ? `${API}${data.audio_url}` : null;
      addMessage('assistant', data.reply_text, data.emotion, audioUrl);
      setEmotion(data.emotion || 'neutral');
      loadMood(); loadHistory();
    } catch (e) {
      hideTyping();
      addMessage('assistant', 'Connection error — is the server awake?', 'sad', null);
    } finally { btn.disabled = false; input.focus(); }
  }

  // ── Audio ──
  function playAudio(url) { new Audio(url).play().catch(() => alert('Could not play audio.')); }

  // ── Load data ──
  async function loadMood() {
    try { const res = await fetch(`${API}/mood`); const data = await res.json(); renderMoodBars(data.stats); } catch (e) {}
  }

  async function loadProfile() {
    try {
      const res = await fetch(`${API}/profile`); const data = await res.json();
      const el = document.getElementById('profile-content');
      if (data.profile && !data.profile.includes('No profile')) {
        const lines = data.profile.split('\n').filter(l => l.trim());
        el.className = 'profile-text';
        el.innerHTML = '<ul>' + lines.map(l => `<li>${escapeHtml(l.replace(/^[-•*]\s*/, ''))}</li>`).join('') + '</ul>';
      } else { el.className = 'profile-empty'; el.textContent = 'Chat 10+ messages to build your profile.'; }
    } catch (e) {}
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API}/history`); const data = await res.json();
      const el = document.getElementById('history-list');
      if (!data.history || !data.history.length) { el.innerHTML = '<div style="color:var(--text-dim);font-size:12px;padding:8px">No history yet.</div>'; return; }
      el.innerHTML = data.history.slice(-30).reverse().map(m => `
        <div class="history-item">
          <div class="history-role ${m.role === 'user' ? 'user' : 'assistant'}">${m.role === 'user' ? 'YOU' : activeCharName.toUpperCase()}</div>
          <div class="history-content">${escapeHtml(m.content)}</div>
        </div>`).join('');
    } catch (e) {}
  }

  async function loadCharacters() {
    try {
      const res = await fetch(`${API}/characters`); const data = await res.json();
      const el = document.getElementById('character-grid');
      el.innerHTML = Object.entries(data.characters).map(([id, char]) => `
        <div class="char-card ${char.active ? 'active' : ''}" id="char-card-${id}"
          style="--char-active-color:${char.color}"
          onclick="switchCharacter('${id}', ${JSON.stringify(char).replace(/"/g, '&quot;')})">
          <div class="char-dot" style="background:${char.color};box-shadow:0 0 8px ${char.color}60"></div>
          <div class="char-info">
            <div class="char-name" style="color:${char.active ? char.color : 'var(--text)'}">${char.name}</div>
            <div class="char-desc">${char.description}</div>
          </div>
          ${char.active ? `<span class="char-active-badge" style="background:${char.color}">ON</span>` : ''}
        </div>`).join('');
      // apply active character theme
      const active = data.characters[data.active];
      if (active) applyCharacter(data.active, active);
    } catch (e) {}
  }

  async function switchCharacter(id, char) {
    try {
      const res = await fetch(`${API}/characters/${id}`, { method: 'POST' });
      if (!res.ok) return;
      applyCharacter(id, char);
      loadCharacters();
      // Announce the switch in chat
      addMessage('assistant', `Hi! I'm ${char.name} now. ${char.description}`, 'excited', null);
      setEmotion('excited');
    } catch (e) {}
  }

  // ── Tabs ──
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const tabs = ['history', 'characters'];
      t.classList.toggle('active', tabs[i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  // ── Status ──
  async function checkStatus() {
    try {
      const res = await fetch(`${API}/`);
      if (res.ok) { document.getElementById('status-dot').style.cssText = 'width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse-dot 2s ease-in-out infinite'; document.getElementById('status-text').textContent = 'server online'; }
    } catch (e) { document.getElementById('status-dot').style.background = '#f87171'; document.getElementById('status-text').textContent = 'server offline'; }
  }

  // ── Keyboard ──
  document.getElementById('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  document.getElementById('msg-input').addEventListener('input', function() { this.style.height = '44px'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──
  setEmotion('neutral');
  checkStatus();
  loadMood();
  loadProfile();
  loadHistory();
  loadCharacters();
</script>
</body>
</html>
