<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--char:#7c6af7;--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--dim:#4a4a6a;--text:#e2e2f0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Press Start 2P',monospace}

body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:999
}

#canvas{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

#face{
  image-rendering:pixelated;
  cursor:pointer;
  transition:filter 0.2s;
}
#face:hover{filter:brightness(1.15)}

/* bubble */
#bubble{
  position:fixed;
  background:var(--surface);
  border:4px solid var(--char);
  padding:14px 18px;
  font-size:9px;
  line-height:1.9;
  max-width:320px;
  white-space:pre-wrap;
  word-break:break-word;
  opacity:0;
  transition:opacity 0.25s,transform 0.25s;
  transform:translateY(8px);
  pointer-events:none;
  z-index:500;
  box-shadow:4px 4px 0 var(--char);
  color:var(--text);
}
#bubble.show{opacity:1;transform:translateY(0)}
#bubble .tail{
  position:absolute;bottom:-14px;left:24px;
  border:7px solid transparent;
  border-top-color:var(--char);
}
#bubble .tail-inner{
  position:absolute;bottom:-8px;left:28px;
  border:5px solid transparent;
  border-top-color:var(--surface);
  z-index:1;
}

/* status bar */
#statusbar{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;
  background:linear-gradient(180deg,rgba(10,10,15,0.97) 80%,transparent);
  z-index:100;font-size:7px;color:var(--dim);
}
.status-name{color:var(--char);font-size:10px;letter-spacing:2px}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;margin-right:8px;animation:sdot 2s ease-in-out infinite}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:0.3}}
#emotion-label{color:var(--char);transition:color 0.4s}
#char-toggle{cursor:pointer;padding:4px 10px;border:2px solid var(--dim);transition:border-color 0.2s}
#char-toggle:hover{border-color:var(--char);color:var(--char)}

/* char panel */
#char-panel{
  position:fixed;top:52px;right:20px;
  background:var(--surface);border:4px solid var(--border);
  padding:16px;font-size:7px;display:none;z-index:200;
  min-width:220px;box-shadow:4px 4px 0 rgba(0,0,0,0.6)
}
#char-panel.show{display:block}
.char-opt{
  display:flex;align-items:center;gap:10px;padding:9px;
  border:3px solid transparent;cursor:pointer;margin-bottom:6px;
  transition:border-color 0.15s
}
.char-opt:hover{border-color:var(--dim)}
.char-opt.active{border-color:var(--char)}
.char-pip{width:10px;height:10px;flex-shrink:0}
.char-opt-name{color:var(--text);font-size:7px;margin-bottom:3px}
.char-opt-desc{color:var(--dim);font-size:6px}

/* hud */
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:center;gap:10px;padding:14px 24px;
  background:linear-gradient(0deg,rgba(10,10,15,0.97) 80%,transparent);
  z-index:100;
}
#msg-input{
  flex:1;background:var(--surface);border:3px solid var(--dim);
  color:var(--text);font-family:'Press Start 2P',monospace;font-size:8px;
  padding:10px 14px;outline:none;transition:border-color 0.2s
}
#msg-input:focus{border-color:var(--char)}
#msg-input::placeholder{color:var(--dim)}
.hbtn{
  background:var(--surface);border:3px solid var(--dim);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:7px;padding:10px 14px;
  cursor:pointer;white-space:nowrap;transition:border-color 0.2s,color 0.2s
}
.hbtn:hover{border-color:var(--char);color:var(--char)}
.hbtn.rec{border-color:#f87171;color:#f87171;animation:blink 0.5s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* hover ripple */
.ripple{
  position:fixed;pointer-events:none;z-index:998;
  border-radius:50%;border:3px solid var(--char);
  animation:ripple-out 0.6s ease-out forwards
}
@keyframes ripple-out{
  from{width:20px;height:20px;opacity:0.8;margin-top:-10px;margin-left:-10px}
  to{width:80px;height:80px;opacity:0;margin-top:-40px;margin-left:-40px}
}
</style>
</head>
<body>

<div id="canvas">
  <canvas id="face"></canvas>
</div>

<div id="bubble">
  <span id="bubble-text"></span>
  <div class="tail"></div>
  <div class="tail-inner"></div>
</div>

<div id="statusbar">
  <span class="status-name" id="char-name">PIXEL</span>
  <div style="display:flex;align-items:center;gap:20px">
    <span id="emotion-label">NEUTRAL</span>
    <span><span class="sdot"></span><span id="stext">ONLINE</span></span>
    <span id="char-toggle" onclick="toggleCharPanel()">▼ SWITCH</span>
  </div>
</div>

<div id="char-panel">
  <div style="color:var(--dim);margin-bottom:12px;font-size:6px;letter-spacing:1px">SELECT COMPANION</div>
  <div id="char-opts"></div>
</div>

<div id="hud">
  <input id="msg-input" type="text" placeholder="TALK TO PIXEL..." maxlength="300">
  <button class="hbtn" id="rec-btn" onclick="toggleRecord()">⏺ REC</button>
  <button class="hbtn" onclick="sendMessage()">▶ SEND</button>
</div>

<script>
const API = '';

const CHARS = {
  pixel:  {name:'PIXEL', color:'#7c6af7',
    hover:['hey there!','whatcha doing?','*waves*','hi hi!','...oh! hello'],
    click:['ow! that tickles','hehe stop it!','hey!! >_<','*giggles*','you clicked me!'],
    idle: ['...','thinking...','*hums quietly*','bored...','zzzz...']},
  nova:   {name:'NOVA',  color:'#38bdf8',
    hover:['calculating...','scanning you','processing...','interesting specimen','hello, human'],
    click:['unexpected input','recalibrating...','that was... odd','noted.','error: poke detected'],
    idle: ['analyzing data','running models','...','hypothesis forming','all systems nominal']},
  blaze:  {name:'BLAZE', color:'#f97316',
    hover:["LET'S GOOO!!!",'YOOO what up!','HYPE!','you ready?!',"let's DO this"],
    click:['YEAH BABY!!!','WOOOOO!!','LETS GOOOOO','HYPED UP!!!','FIRE FIRE FIRE'],
    idle: ['SO BORED RN','energy: 9000','LETS DO SOMETHING','tick tock tick tock','COME ON!!']},
  sage:   {name:'SAGE',  color:'#4ade80',
    hover:['the observer arrives...','stillness and motion, one','your presence is felt','all things return','welcome, wanderer'],
    click:['pain is but sensation','even stones feel the rain','the river bends...','hm. unexpected.','all is connected'],
    idle: ['...','the stars move slowly','patience is a root','silence speaks','contemplating']},
  glitch: {name:'GLITCH',color:'#f472b6',
    hover:['H̷̡̛ELLO̵','ERROR 404','glitch detected!','wh-wh-whooo??','01001000 01001001'],
    click:['!?!?!?!?!','SYSTEM BREACHED','glitching out!!','AAAA̷̡̕AAAA','critical hit!'],
    idle: ['err0r...','reboot required?','GLITCHING','01100001','memor̷y corrupt̶ed']},
};

const EMOTIONS = {
  happy:'#4ade80', sad:'#60a5fa', thinking:'#f59e0b',
  curious:'#a78bfa', neutral:'#94a3b8', excited:'#f472b6',
};

let activeChar = 'pixel';
let currentColor = '#7c6af7';
let currentEmotion = 'neutral';
let isTalking = false;
let isBlinking = false;
let blinkTimer = 0;
let hoverActive = false;
let idleTimer = 0;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

// ── Canvas setup ──
const cv = document.getElementById('face');
const ctx = cv.getContext('2d');
let PX = 10;
let GW = 20, GH = 26;

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight - 110;
  PX = Math.floor(Math.min(vw/GW, vh/GH) * 0.88);
  PX = Math.max(8, Math.min(PX, 36));
  cv.width = GW * PX;
  cv.height = GH * PX;
}
resize();
window.addEventListener('resize', resize);

function dp(x,y,c){ ctx.fillStyle=c; ctx.fillRect(x*PX,y*PX,PX,PX); }
function dr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x*PX,y*PX,w*PX,h*PX); }

function drawFace(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const C = currentColor;
  const DARK = '#0a0a0f';
  const LIGHT = '#e2e2f0';
  const SCREEN = '#0d0d16';
  const EC = EMOTIONS[currentEmotion] || LIGHT;

  // Body shell
  dr(1,1,18,24,C);
  // Corners cut (pixel-art rounding)
  dp(1,1,DARK); dp(18,1,DARK); dp(1,24,DARK); dp(18,24,DARK);
  // Inner screen area
  dr(2,2,16,15,SCREEN);
  // Screen bezel
  dr(3,3,14,13,'#080810');

  // Antenna
  dp(9,0,C); dp(10,0,C); dp(11,0,C);
  dp(10,1,C);

  // ── Eyes ──
  if(isBlinking){
    dr(4,8,4,1,EC); dr(12,8,4,1,EC);
  } else if(hoverActive){
    // Surprised / wide eyes
    dr(4,7,4,4,EC); dr(12,7,4,4,EC);
    dp(4,7,LIGHT); dp(12,7,LIGHT);
    // Pupils
    dp(5,8,DARK); dp(13,8,DARK);
  } else {
    if(currentEmotion==='sad'){
      dr(4,9,4,3,EC); dr(12,9,4,3,EC);
      dp(5,12,EC); dp(13,12,EC); // tears
    } else if(currentEmotion==='excited'){
      // Star eyes
      dp(5,7,EC); dp(6,7,EC); dr(4,8,4,1,EC); dp(5,9,EC); dp(6,9,EC);
      dp(13,7,EC); dp(14,7,EC); dr(12,8,4,1,EC); dp(13,9,EC); dp(14,9,EC);
    } else if(currentEmotion==='thinking'){
      dr(4,8,4,3,EC); dr(12,9,4,2,EC); // one squinting
    } else if(currentEmotion==='curious'){
      dp(3,7,EC); dr(4,8,4,3,EC); dr(12,8,4,3,EC); // eyebrow
    } else {
      dr(4,8,4,3,EC); dr(12,8,4,3,EC);
      dp(4,8,LIGHT); dp(12,8,LIGHT); // shine
    }
  }

  // ── Mouth ──
  if(isTalking){
    const f = Math.floor(Date.now()/100)%3;
    if(f===0){ dr(6,14,8,1,EC); }
    else if(f===1){ dr(6,13,8,2,EC); dp(6,13,DARK); dp(13,13,DARK); }
    else { dr(6,13,8,3,EC); dr(7,13,6,1,DARK); }
  } else {
    if(hoverActive){
      // Surprised O
      dr(7,13,6,3,EC); dr(8,14,4,1,DARK);
    } else if(currentEmotion==='happy'||currentEmotion==='excited'){
      dr(6,14,8,1,EC); dp(5,13,EC); dp(14,13,EC);
    } else if(currentEmotion==='sad'){
      dr(6,15,8,1,EC); dp(5,16,EC); dp(14,16,EC);
    } else if(currentEmotion==='thinking'){
      dr(8,14,5,1,EC); dp(13,13,EC);
    } else {
      dr(6,14,8,1,EC);
    }
  }

  // ── Bottom body details ──
  dr(2,17,16,7,C);
  // Buttons row
  dr(3,19,2,2,DARK); dr(7,19,2,2,DARK); dr(11,19,2,2,DARK); dr(15,19,2,2,DARK);
  // D-pad
  dp(4,19,EC); dp(4,20,EC); dp(3,20,EC); dp(5,20,EC);
  // Action buttons
  dp(15,19,C); dp(16,20,C); dp(15,21,C); dp(14,20,C);

  // Legs
  dr(3,25,3,1,C); dr(14,25,3,1,C);
  dr(3,25,2,1,'#0a0a0f'); dr(15,25,2,1,'#0a0a0f');
  dr(3,25,3,1,C); dr(14,25,3,1,C);

  // Feet
  dr(2,25,4,1,C); dr(14,25,4,1,C);
}

// ── Animation loop ──
function loop(){
  drawFace();

  // Blink logic
  blinkTimer++;
  if(blinkTimer > 200 + Math.random()*150){
    blinkTimer = 0;
    isBlinking = true;
    setTimeout(()=>isBlinking=false, 100);
  }

  // Idle reaction
  idleTimer++;
  if(idleTimer > 600){
    idleTimer = 0;
    const char = CHARS[activeChar];
    if(char && !isTalking){
      const lines = char.idle;
      showBubble(lines[Math.floor(Math.random()*lines.length)], 3000);
    }
  }

  requestAnimationFrame(loop);
}
loop();

// ── Mouse interaction ──
cv.addEventListener('mouseenter', ()=>{
  hoverActive = true;
  const char = CHARS[activeChar];
  if(char){
    const lines = char.hover;
    showBubble(lines[Math.floor(Math.random()*lines.length)], 2500);
  }
});

cv.addEventListener('mouseleave', ()=>{
  hoverActive = false;
});

cv.addEventListener('click', (e)=>{
  const char = CHARS[activeChar];
  if(char){
    const lines = char.click;
    showBubble(lines[Math.floor(Math.random()*lines.length)], 3000);
    // Pick emotion based on character
    const clickEmotions = {
      pixel:'happy', nova:'thinking', blaze:'excited',
      sage:'curious', glitch:'excited'
    };
    setEmotion(clickEmotions[activeChar]||'happy');
    setTimeout(()=>setEmotion('neutral'), 3000);
  }
  // Ripple effect
  spawnRipple(e.clientX, e.clientY);
});

function spawnRipple(x,y){
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x+'px';
  r.style.top = y+'px';
  r.style.borderColor = currentColor;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(), 650);
}

// ── Bubble ──
function showBubble(text, duration=4000){
  const b = document.getElementById('bubble');
  const bt = document.getElementById('bubble-text');
  bt.textContent = text;
  b.style.borderColor = currentColor;
  b.querySelector('.tail').style.borderTopColor = currentColor;

  // Position above the character
  const rect = cv.getBoundingClientRect();
  const bw = 320;
  let bx = rect.left + rect.width/2 - bw/2;
  bx = Math.max(16, Math.min(bx, window.innerWidth - bw - 16));
  const by = rect.top - 20;

  b.style.left = bx+'px';
  b.style.top = Math.max(60, by - 120)+'px';
  b.style.width = bw+'px';

  b.classList.add('show');
  clearTimeout(window._bt);
  window._bt = setTimeout(()=>b.classList.remove('show'), duration);
}

// ── Emotion ──
function setEmotion(e){
  currentEmotion = e;
  const col = EMOTIONS[e]||'#94a3b8';
  document.getElementById('emotion-label').textContent = e.toUpperCase();
  document.getElementById('emotion-label').style.color = col;
}

// ── Send text ──
async function sendMessage(){
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  showBubble('...', 10000);
  isTalking = true;
  try{
    const res = await fetch(`${API}/chat/text`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });
    const d = await res.json();
    setEmotion(d.emotion||'neutral');
    showBubble(d.reply_text||'...', 8000);
    if(d.audio_url) playAudio(`${API}${d.audio_url}`);
    else isTalking = false;
  } catch(err){
    showBubble('connection lost...', 3000);
    setEmotion('sad'); isTalking = false;
  }
}

// ── Voice recording ──
async function toggleRecord(){
  const btn = document.getElementById('rec-btn');
  if(!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudio;
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('rec');
      btn.textContent = '⏹ STOP';
      showBubble('listening...', 30000);
      setEmotion('curious');
    } catch(e){
      showBubble('mic blocked!', 3000);
      setEmotion('sad');
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    isRecording = false;
    btn.classList.remove('rec');
    btn.textContent = '⏺ REC';
  }
}

async function sendAudio(){
  showBubble('processing...', 10000);
  isTalking = true;
  const blob = new Blob(audioChunks, {type:'audio/webm'});
  const form = new FormData();
  form.append('file', blob, 'rec.webm');
  try{
    const res = await fetch(`${API}/chat`,{method:'POST',body:form});
    const d = await res.json();
    setEmotion(d.emotion||'neutral');
    const txt = d.transcribed_text ? `"${d.transcribed_text}"\n\n${d.reply_text}` : (d.reply_text||'...');
    showBubble(txt, 8000);
    if(d.audio_url) playAudio(`${API}${d.audio_url}`);
    else isTalking = false;
  } catch(e){
    showBubble('error...', 3000);
    setEmotion('sad'); isTalking = false;
  }
}

function playAudio(url){
  isTalking = true;
  const a = new Audio(url);
  a.onended = ()=>isTalking=false;
  a.onerror = ()=>isTalking=false;
  a.play().catch(()=>isTalking=false);
}

// ── Character panel ──
function toggleCharPanel(){
  document.getElementById('char-panel').classList.toggle('show');
  loadChars();
}

async function loadChars(){
  try{
    const res = await fetch(`${API}/characters`);
    const d = await res.json();
    activeChar = d.active;
    const el = document.getElementById('char-opts');
    el.innerHTML = Object.entries(d.characters).map(([id,c])=>`
      <div class="char-opt ${c.active?'active':''}" onclick="switchChar('${id}')"
        style="${c.active?`border-color:${CHARS[id]?.color}`:''}">
        <div class="char-pip" style="background:${CHARS[id]?.color||'#7c6af7'}"></div>
        <div>
          <div class="char-opt-name" style="${c.active?`color:${CHARS[id]?.color}`:''}">
            ${CHARS[id]?.name||id.toUpperCase()}</div>
          <div class="char-opt-desc">${c.description}</div>
        </div>
      </div>`).join('');
    applyChar(d.active);
  } catch(e){}
}

function applyChar(id){
  const c = CHARS[id];
  if(!c) return;
  activeChar = id;
  currentColor = c.color;
  document.documentElement.style.setProperty('--char', c.color);
  document.getElementById('char-name').textContent = c.name;
}

async function switchChar(id){
  await fetch(`${API}/characters/${id}`,{method:'POST'});
  applyChar(id);
  document.getElementById('char-panel').classList.remove('show');
  const c = CHARS[id];
  if(c){
    showBubble(`${c.name} mode activated!`, 3000);
    setEmotion('excited');
    setTimeout(()=>setEmotion('neutral'), 3000);
  }
}

// ── Notifications ──
async function checkNotifs(){
  try{
    const res = await fetch(`${API}/notifications`);
    const d = await res.json();
    if(d.messages?.length>0){
      showBubble(d.messages[d.messages.length-1].content, 8000);
      setEmotion('curious');
    }
  } catch(e){}
}

// ── Close panel on outside click ──
document.addEventListener('click',e=>{
  const panel = document.getElementById('char-panel');
  const toggle = document.getElementById('char-toggle');
  if(!panel.contains(e.target)&&e.target!==toggle) panel.classList.remove('show');
});

// ── Enter to send ──
document.getElementById('msg-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') sendMessage();
});

// ── Init ──
loadChars();
setEmotion('neutral');
setInterval(checkNotifs, 30000);
setTimeout(()=>{
  showBubble('click me! or type below...',4000);
  setEmotion('happy');
  setTimeout(()=>setEmotion('neutral'),4000);
},900);
</script>
</body>
</html>
