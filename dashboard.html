<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --border:#1e1e2e;
  --text:#e2e2f0;
  --dim:#4a4a6a;
  --px:4px;
  --char:#7c6af7;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Press Start 2P',monospace;overflow:hidden}

/* ── Scanline overlay ── */
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  pointer-events:none;z-index:999
}

/* ── Main canvas ── */
#canvas{position:fixed;inset:0}

/* ── Pixel character ── */
#char{position:absolute;cursor:default;user-select:none}

/* ── Body of the character (Beemo-style rectangle) ── */
.char-body{
  position:relative;
  image-rendering:pixelated;
}

/* ── Chat bubble ── */
#bubble{
  position:absolute;
  background:var(--surface);
  border:var(--px) solid var(--char);
  padding:12px 16px;
  font-size:8px;
  line-height:1.8;
  max-width:280px;
  white-space:pre-wrap;
  word-break:break-word;
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
  image-rendering:pixelated;
  box-shadow:4px 4px 0 var(--char);
}
#bubble.show{opacity:1}
#bubble::after{
  content:'';position:absolute;
  bottom:-12px;left:20px;
  border:6px solid transparent;
  border-top-color:var(--char);
}

/* ── HUD ── */
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:center;gap:12px;
  padding:16px 24px;
  background:linear-gradient(0deg,rgba(10,10,15,0.98) 80%,transparent);
  z-index:100;
}

#msg-input{
  flex:1;
  background:var(--surface);
  border:var(--px) solid var(--dim);
  color:var(--text);
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  padding:10px 14px;
  outline:none;
  transition:border-color 0.2s;
  image-rendering:pixelated;
}
#msg-input:focus{border-color:var(--char)}
#msg-input::placeholder{color:var(--dim)}

.hud-btn{
  background:var(--surface);
  border:var(--px) solid var(--dim);
  color:var(--text);
  font-family:'Press Start 2P',monospace;
  font-size:7px;
  padding:10px 14px;
  cursor:pointer;
  transition:border-color 0.2s,color 0.2s;
  white-space:nowrap;
  image-rendering:pixelated;
}
.hud-btn:hover{border-color:var(--char);color:var(--char)}
.hud-btn.active{border-color:#f87171;color:#f87171;animation:blink 0.6s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── Status bar top ── */
#statusbar{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:linear-gradient(180deg,rgba(10,10,15,0.98) 80%,transparent);
  z-index:100;
  font-size:7px;
  color:var(--dim);
}
.status-name{color:var(--char);font-size:9px}
.status-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#4ade80;box-shadow:0 0 6px #4ade80;
  margin-right:6px;animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Notification bell ── */
#notif-count{
  display:none;background:#f87171;color:#0a0a0f;
  font-size:6px;padding:2px 5px;margin-left:8px;
}

/* ── Character switcher panel ── */
#char-panel{
  position:fixed;top:50px;right:16px;
  background:var(--surface);
  border:var(--px) solid var(--border);
  padding:16px;
  font-size:7px;
  display:none;
  z-index:200;
  min-width:200px;
  box-shadow:4px 4px 0 rgba(0,0,0,0.5);
}
#char-panel.show{display:block}
.char-option{
  display:flex;align-items:center;gap:10px;
  padding:8px;border:var(--px) solid transparent;
  cursor:pointer;margin-bottom:6px;transition:border-color 0.2s;
}
.char-option:hover{border-color:var(--dim)}
.char-option.active{border-color:var(--char)}
.char-pip{width:10px;height:10px;image-rendering:pixelated}
.char-option-name{color:var(--text);font-size:7px}
.char-option-desc{color:var(--dim);font-size:6px;margin-top:3px}

/* ── Pixel-art face drawn with CSS ── */
.px-face{image-rendering:pixelated;position:relative}
</style>
</head>
<body>

<div id="canvas">
  <div id="char">
    <div id="bubble"></div>
    <canvas id="face" width="160" height="200"></canvas>
  </div>
</div>

<div id="statusbar">
  <div>
    <span class="status-name" id="char-name">PIXEL</span>
    <span id="notif-count"></span>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <span id="emotion-label" style="color:var(--char)">NEUTRAL</span>
    <span><span class="status-dot"></span><span id="status-text">ONLINE</span></span>
    <span id="char-toggle" style="cursor:pointer;color:var(--dim)" onclick="toggleCharPanel()">▼ SWITCH</span>
  </div>
</div>

<div id="char-panel">
  <div style="color:var(--dim);margin-bottom:12px;font-size:6px">SELECT COMPANION</div>
  <div id="char-options"></div>
</div>

<div id="hud">
  <input id="msg-input" type="text" placeholder="TALK TO PIXEL..." maxlength="200">
  <button class="hud-btn" id="record-btn" onclick="toggleRecord()">⏺ REC</button>
  <button class="hud-btn" onclick="sendMessage()">▶ SEND</button>
</div>

<script>
const API = '';

// ── Character data ──
const CHARS = {
  pixel:  {name:'PIXEL', color:'#7c6af7', desc:'warm & curious'},
  nova:   {name:'NOVA',  color:'#38bdf8', desc:'calm scientist'},
  blaze:  {name:'BLAZE', color:'#f97316', desc:'hype & energy'},
  sage:   {name:'SAGE',  color:'#4ade80', desc:'wise & poetic'},
  glitch: {name:'GLITCH',color:'#f472b6', desc:'chaotic trickster'},
};

const EMOTION_COLORS = {
  happy:'#4ade80', sad:'#60a5fa', thinking:'#f59e0b',
  curious:'#a78bfa', neutral:'#94a3b8', excited:'#f472b6',
};

let activeChar = 'pixel';
let currentEmotion = 'neutral';
let currentColor = '#7c6af7';
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let isTalking = false;
let talkInterval = null;
let charX = 0, charY = 0;
let velX = 0.4, velY = 0.3;
let blinkTimer = 0;
let isBlinking = false;
let idleTimer = 0;
let idleAction = null;

// ── Canvas face renderer ──
const canvas = document.getElementById('face');
const ctx = canvas.getContext('2d');
const W = 160, H = 200;
const PX = 8; // pixel size

function rgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${r},${g},${b})`;
}

function drawPixel(x,y,color){
  ctx.fillStyle = color;
  ctx.fillRect(x*PX, y*PX, PX, PX);
}

function drawRect(x,y,w,h,color){
  for(let i=x;i<x+w;i++) for(let j=y;j<y+h;j++) drawPixel(i,j,color);
}

function drawFace(){
  ctx.clearRect(0,0,W,H);

  const col = currentColor;
  const dark = '#0a0a0f';
  const light = '#e2e2f0';
  const screen = '#111118';

  // Body (Beemo-style rounded rectangle)
  // Outer shell
  drawRect(1,2,18,21,col);
  // Inner screen
  drawRect(2,3,16,14,screen);
  // Bottom body
  drawRect(2,17,16,5,col);
  // Antenna
  drawPixel(9,0,col);
  drawPixel(10,0,col);
  drawPixel(10,1,col);
  drawPixel(11,1,col);

  // Screen bezel
  drawRect(3,4,14,12,'#0d0d14');

  // ── Eyes ──
  const eyeColor = EMOTION_COLORS[currentEmotion] || light;

  if(isBlinking){
    // Blink — flat line
    drawRect(4,8,3,1,eyeColor);
    drawRect(13,8,3,1,eyeColor);
  } else {
    // Normal eyes based on emotion
    if(currentEmotion === 'sad'){
      // Droopy eyes — shifted down
      drawRect(4,9,3,3,eyeColor);
      drawRect(13,9,3,3,eyeColor);
      // Teardrops
      drawPixel(5,12,eyeColor);
      drawPixel(14,12,eyeColor);
    } else if(currentEmotion === 'excited'){
      // Star eyes
      drawPixel(5,7,eyeColor); drawPixel(5,9,eyeColor);
      drawRect(4,8,3,1,eyeColor); drawPixel(5,8,eyeColor);
      drawPixel(14,7,eyeColor); drawPixel(14,9,eyeColor);
      drawRect(13,8,3,1,eyeColor); drawPixel(14,8,eyeColor);
    } else if(currentEmotion === 'thinking'){
      // One eye squinted
      drawRect(4,8,3,3,eyeColor);
      drawRect(13,9,3,1,eyeColor);
    } else if(currentEmotion === 'curious'){
      // One eyebrow raised
      drawPixel(3,7,eyeColor);
      drawRect(4,8,3,3,eyeColor);
      drawRect(13,8,3,3,eyeColor);
    } else {
      // Default / happy / neutral — round eyes
      drawRect(4,8,3,3,eyeColor);
      drawRect(13,8,3,3,eyeColor);
      // Shine dots
      drawPixel(4,8,light);
      drawPixel(13,8,light);
    }
  }

  // ── Mouth ──
  if(isTalking){
    // Open mouth — animate between shapes
    const frame = Math.floor(Date.now()/120) % 3;
    if(frame === 0){
      drawRect(6,13,8,1,eyeColor);
    } else if(frame === 1){
      drawRect(6,12,8,2,eyeColor);
      drawPixel(6,12,dark); drawPixel(13,12,dark);
    } else {
      drawRect(6,12,8,3,eyeColor);
      drawRect(7,12,6,1,dark);
    }
  } else {
    if(currentEmotion === 'happy' || currentEmotion === 'excited'){
      // Smile
      drawRect(6,13,8,1,eyeColor);
      drawPixel(5,12,eyeColor);
      drawPixel(14,12,eyeColor);
    } else if(currentEmotion === 'sad'){
      // Frown
      drawRect(6,14,8,1,eyeColor);
      drawPixel(5,15,eyeColor);
      drawPixel(14,15,eyeColor);
    } else if(currentEmotion === 'thinking'){
      // Side mouth
      drawRect(8,13,5,1,eyeColor);
      drawPixel(13,12,eyeColor);
    } else {
      // Neutral line
      drawRect(6,13,8,1,eyeColor);
    }
  }

  // ── Bottom controls (Beemo buttons) ──
  drawRect(3,18,2,2,dark);
  drawRect(7,18,2,2,dark);
  drawRect(11,18,2,2,dark);
  drawRect(15,18,2,2,dark);
  // D-pad hint
  drawPixel(4,18,col); drawPixel(4,19,col);
  drawPixel(8,18,col);

  // Legs
  drawRect(3,23,3,2,col);
  drawRect(14,23,3,2,col);
  drawRect(3,25,4,1,col);
  drawRect(13,25,4,1,col);
}

// ── Animation loop ──
function animLoop(){
  drawFace();
  requestAnimationFrame(animLoop);
}
animLoop();

// ── Drift movement ──
function moveChar(){
  const el = document.getElementById('char');
  const canvas = document.getElementById('canvas');
  const pw = canvas.offsetWidth - 160;
  const ph = canvas.offsetHeight - 280;

  charX += velX;
  charY += velY;

  // Bounce off walls
  if(charX <= 0){ charX = 0; velX = Math.abs(velX); }
  if(charX >= pw){ charX = pw; velX = -Math.abs(velX); }
  if(charY <= 40){ charY = 40; velY = Math.abs(velY); }
  if(charY >= ph){ charY = ph; velY = -Math.abs(velY); }

  // Slight random drift
  velX += (Math.random()-0.5)*0.05;
  velY += (Math.random()-0.5)*0.05;
  velX = Math.max(-1.2, Math.min(1.2, velX));
  velY = Math.max(-0.8, Math.min(0.8, velY));

  el.style.left = charX + 'px';
  el.style.top = charY + 'px';

  // Blink randomly
  blinkTimer++;
  if(blinkTimer > 180 + Math.random()*120){
    blinkTimer = 0;
    isBlinking = true;
    setTimeout(()=>{ isBlinking = false; }, 120);
  }
}

setInterval(moveChar, 16);

// ── Init position ──
charX = window.innerWidth/2 - 80;
charY = window.innerHeight/2 - 100;

// ── Bubble positioning ──
function showBubble(text){
  const bubble = document.getElementById('bubble');
  bubble.textContent = text;
  bubble.classList.add('show');

  // Position bubble above or below
  const charEl = document.getElementById('char');
  const rect = charEl.getBoundingClientRect();
  if(rect.top > 160){
    bubble.style.bottom = '210px';
    bubble.style.top = 'auto';
    bubble.style.removeProperty('transform');
    bubble.style.removeProperty('top');
    bubble.querySelector && null;
    bubble.style.cssText += ';bottom:210px;top:auto';
  } else {
    bubble.style.top = '210px';
    bubble.style.bottom = 'auto';
  }

  clearTimeout(window._bubbleTimer);
  window._bubbleTimer = setTimeout(()=>{ bubble.classList.remove('show'); }, 8000);
}

// ── Send text message ──
async function sendMessage(){
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  showBubble('...');
  startTalking();

  try{
    const res = await fetch(`${API}/chat/text`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });
    const data = await res.json();
    setEmotion(data.emotion || 'neutral');
    showBubble(data.reply_text || 'hmm...');
    if(data.audio_url) playAudio(`${API}${data.audio_url}`);
    else stopTalking();
  } catch(e){
    showBubble('connection lost...');
    setEmotion('sad');
    stopTalking();
  }
}

// ── Voice recording ──
async function toggleRecord(){
  if(!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudio;
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('record-btn').classList.add('active');
      document.getElementById('record-btn').textContent = '⏹ STOP';
      showBubble('listening...');
    } catch(e){
      showBubble('mic blocked!');
      setEmotion('sad');
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    isRecording = false;
    document.getElementById('record-btn').classList.remove('active');
    document.getElementById('record-btn').textContent = '⏺ REC';
  }
}

async function sendAudio(){
  showBubble('processing...');
  startTalking();
  const blob = new Blob(audioChunks, {type:'audio/webm'});
  const form = new FormData();
  form.append('file', blob, 'recording.webm');
  try{
    const res = await fetch(`${API}/chat`,{method:'POST',body:form});
    const data = await res.json();
    setEmotion(data.emotion || 'neutral');
    const text = data.transcribed_text ? `"${data.transcribed_text}"\n\n${data.reply_text}` : data.reply_text;
    showBubble(text || 'hmm...');
    if(data.audio_url) playAudio(`${API}${data.audio_url}`);
    else stopTalking();
  } catch(e){
    showBubble('error...');
    setEmotion('sad');
    stopTalking();
  }
}

// ── Audio playback ──
function playAudio(url){
  startTalking();
  const audio = new Audio(url);
  audio.onended = stopTalking;
  audio.onerror = stopTalking;
  audio.play().catch(stopTalking);
}

function startTalking(){
  isTalking = true;
}

function stopTalking(){
  isTalking = false;
}

// ── Emotion ──
function setEmotion(emotion){
  currentEmotion = emotion;
  const color = EMOTION_COLORS[emotion] || '#94a3b8';
  document.getElementById('emotion-label').textContent = emotion.toUpperCase();
  document.getElementById('emotion-label').style.color = color;
}

// ── Character switching ──
function toggleCharPanel(){
  document.getElementById('char-panel').classList.toggle('show');
  loadCharacters();
}

async function loadCharacters(){
  try{
    const res = await fetch(`${API}/characters`);
    const data = await res.json();
    const el = document.getElementById('char-options');
    el.innerHTML = Object.entries(data.characters).map(([id,c])=>`
      <div class="char-option ${c.active?'active':''}" onclick="switchChar('${id}')"
        style="${c.active?`border-color:${CHARS[id]?.color||'#7c6af7'}`:''}">
        <div class="char-pip" style="background:${CHARS[id]?.color||'#7c6af7'}"></div>
        <div>
          <div class="char-option-name" style="${c.active?`color:${CHARS[id]?.color||'#7c6af7'}`:''}">
            ${CHARS[id]?.name||id.toUpperCase()}
          </div>
          <div class="char-option-desc">${c.description}</div>
        </div>
      </div>`).join('');
    activeChar = data.active;
    const ac = CHARS[data.active];
    if(ac){
      currentColor = ac.color;
      document.documentElement.style.setProperty('--char', ac.color);
      document.getElementById('char-name').textContent = ac.name;
    }
  } catch(e){}
}

async function switchChar(id){
  await fetch(`${API}/characters/${id}`,{method:'POST'});
  const c = CHARS[id];
  if(c){
    currentColor = c.color;
    document.documentElement.style.setProperty('--char', c.color);
    document.getElementById('char-name').textContent = c.name;
    showBubble(`switching to ${c.name.toLowerCase()} mode...`);
    setEmotion('excited');
  }
  document.getElementById('char-panel').classList.remove('show');
  setTimeout(loadCharacters, 300);
}

// ── Notifications polling ──
async function checkNotifications(){
  try{
    const res = await fetch(`${API}/notifications`);
    const data = await res.json();
    if(data.messages && data.messages.length > 0){
      const msg = data.messages[data.messages.length-1];
      showBubble(msg.content);
      setEmotion('curious');
    }
  } catch(e){}
}

// ── Enter to send ──
document.getElementById('msg-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') sendMessage();
});

// ── Close char panel on click outside ──
document.addEventListener('click',e=>{
  const panel = document.getElementById('char-panel');
  const toggle = document.getElementById('char-toggle');
  if(!panel.contains(e.target) && e.target !== toggle){
    panel.classList.remove('show');
  }
});

// ── Init ──
loadCharacters();
setEmotion('neutral');
setInterval(checkNotifications, 30000);

// Startup message
setTimeout(()=>{
  showBubble('hey! press REC to talk\nor type below...');
  setEmotion('happy');
},800);
</script>
</body>
</html>
